plugins { id "com.android.application" }

def appVersion = new Properties()
rootProject.file("version.properties").withInputStream { appVersion.load(it) }

def signingFile = rootProject.file("signing.properties")
def localSigning = new Properties()
if (signingFile.isFile()) {
    signingFile.withInputStream { localSigning.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { property ->
        if (!localSigning.getProperty(property)) {
            throw new GradleException("Missing ${property} in android/signing.properties")
        }
    }
}

android {
    namespace "org.libsdl.app"
    compileSdk 37
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.codex.eduke32"
        minSdk 24
        targetSdk 35
        versionCode appVersion.getProperty("VERSION_CODE").toInteger()
        versionName appVersion.getProperty("VERSION_NAME")
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        if (signingFile.isFile()) {
            sharedKey {
                storeFile rootProject.file(localSigning.getProperty("storeFile"))
                storePassword localSigning.getProperty("storePassword")
                keyAlias localSigning.getProperty("keyAlias")
                keyPassword localSigning.getProperty("keyPassword")
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingFile.isFile() ? signingConfigs.sharedKey : signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (signingFile.isFile()) signingConfig signingConfigs.sharedKey
        }
    }
    sourceSets {
        main {
            java.srcDirs += ["../SDL/android-project/app/src/main/java"]
            res.srcDirs += ["../SDL/android-project/app/src/main/res"]
        }
    }
    externalNativeBuild {
        cmake { path file("jni/CMakeLists.txt"); version "3.22.1" }
    }
    androidResources { noCompress "sf2" }
    packaging { jniLibs { useLegacyPackaging = true } }
}
